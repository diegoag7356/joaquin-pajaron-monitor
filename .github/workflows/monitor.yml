name: Monitor Joaquín Pajarón

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar actuaciones
        run: |
          python - <<'PY'
          import requests

          url = "https://www.joaquinpajaron.com/actuaciones/"

          r = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=20
          )

          print("Estado:", r.status_code)

          if r.status_code != 200:
              raise Exception(f"La web respondió con {r.status_code}")

          text = r.text.lower()

          palabras = [
              "26 de diciembre",
              "campoamor",
              "oviedo"
          ]

          if all(p in text for p in palabras):
              print("🎟️ ¡PUEDE HABER APARECIDO LA ACTUACIÓN!")
          else:
              print("Todavía no aparece.")
          PY
